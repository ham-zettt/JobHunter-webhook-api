[project]
name = "job-scraper"
version = "1.0.0"
description = "Job Scraper API — agregasi lowongan kerja dari 7 platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "playwright>=1.49",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: uji terhadap situs nyata (manual, bukan CI)"]
addopts = "-q -m \"not live\""
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/scrapers/platforms/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"]
"scripts/**" = ["ASYNC"]
